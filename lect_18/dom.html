<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1{
            color: darkblue;
        }

        .box{
            width: 250px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0px 0px 10px gray;
        }

        button{
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: darkblue;
            color: white;
            border-radius: 5px;
        }

        .dark{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
      <h1 id="heading">DOM Lecture</h1>

    <p class="text">
        Welcome to JavaScript DOM Class
    </p>
    <br>

    <p class="text">
        We are learning selectors and events
    </p>
    <br>

    <div class="box" id="box">
        This is Box
    </div>
    <br>

    <button onclick="changeText()">
        Change Heading
    </button>
    <br>

    <button onclick="changeColor()">
        Change Box Color
    </button>
    <br>

    <button onclick="toggleTheme()">
        Toggle Theme
    </button>
    <br>

    <button onclick="addContent()">
        Add Content
    </button>
    <br>



    <script src="dom.js"></script>
</body>
</html>
