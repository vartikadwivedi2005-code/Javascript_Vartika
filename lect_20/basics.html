<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All JS Basics in One Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 30px;
            text-align: center;
            transition: background 0.3s;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: all 0.2s;
            margin-top: 10px;
        }
        ul {
            text-align: left;
            margin-top: 20px;
        }
        li {
            padding: 8px;
            background: #eee;
            margin: 5px 0;
            border-radius: 4px;
            list-style-type: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- DOM Elements jinhe hum JS se control karenge -->
        <h1 id="main-title">JS Basics Playground</h1>
        <p id="status-text">Task Status: Loading...</p>
        
        <button id="actionBtn">Add Random Task</button>
    </div>

    <script src="basics.js">
        

    </script>
</body>
</html>
