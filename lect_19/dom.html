<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Changer</title>
    <style>
        /* Thodi si simple styling takki page accha dikhe */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease; /* Isse color smooth change hoga */
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. HTML mein humne ek button banaya aur usko id de di -->
    <button id="colorBtn">Change Color</button>

    <script src="dom.js">
      
    </script>

</body>
</html>
