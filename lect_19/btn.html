<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            text-align: center;
            padding-top: 50px;
            font-family: Arial;
        }
        #box {
            width: 150px;
            height: 150px;
            background-color: crimson;
            margin: 20px auto;
            color: white;
            line-height: 150px; /* Text ko center karne ke liye */
            font-weight: bold;
            border-radius: 10px;
            transition: transform 0.3s, background-color 0.3s;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="actionBtn">Magic Button</button>
    <div id="box">Normal Box</div>

    <script src="btn.js">
        
    </script>

</body>
</html>
