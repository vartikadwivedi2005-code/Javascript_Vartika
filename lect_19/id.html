<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS Hover Basics</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        #hoverBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border: 2px solid black;
            background-color: white;
            border-radius: 5px;
            /* Smooth transition style change karne ke liye */
            transition: all 0.3s ease; 
        }
    </style>
</head>
<body>

    <!-- Humne button banaya aur unique ID di -->
    <button id="hoverBtn">Mujh par Mouse Lao!</button>

    <script src="id.js">
        
    </script>

</body>
</html>


<!-- 2. Hover Effect Ka Basic Code (Mouseenter & Mouseleave)
Jab hum CSS ke bina, pure JavaScript se hover effect banana chahte hain, toh hume do events ka use karna padta hai: ek aane ke liye (mouseenter) aur ek jaane ke liye (mouseleave). -->
